name: Link Check

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.md"
      - ".github/workflows/links.yml"
  pull_request:
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200..=299,429 './**/*.md'
          fail: true
