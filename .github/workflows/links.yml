name: Link Check

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.md"
      - ".github/workflows/links.yml"
  pull_request:
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # nvd.nist.gov blocks automated checkers (bot protection); exclude that host only.
          args: --no-progress --accept 200..=299,429 --timeout 30 --max-retries 3 --retry-wait-time 3 --exclude 'nvd\.nist\.gov' './**/*.md'
          fail: true
